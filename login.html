<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>Sign in | Daily Expense Tracker</title>
    <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/ff/e5/c8/ffe5c8bfff56af5eb39a3f13dd4bde26.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body.login-body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; background: #eef0fb; }
        .login-card { width: 100%; max-width: 420px; background: #fff; border-radius: 18px; padding: 2rem 1.75rem; box-shadow: 0 10px 40px rgba(79, 70, 229, .15); }
        .login-badge { width: 56px; height: 56px; border-radius: 14px; background: #4f46e5; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin: 0 auto 1rem; }
        .login-card h1 { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: .25rem; }
        .login-card .sub { text-align: center; color: #6b7280; margin-bottom: 1.25rem; font-size: .93rem; }
        .auth-tabs { display: flex; background: #f3f4f6; border-radius: 12px; padding: 4px; margin-bottom: 1.25rem; }
        .auth-tabs button { flex: 1; border: 0; background: transparent; padding: .55rem; border-radius: 9px; font-weight: 600; color: #6b7280; }
        .auth-tabs button.active { background: #fff; color: #4f46e5; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        .pw-wrap { position: relative; }
        .pw-wrap .form-control { padding-right: 2.8rem; }
        .pw-toggle { position: absolute; right: .4rem; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: #6b7280; padding: .4rem .6rem; }
        #authMsg { display: none; }
    </style>
</head>
<body class="login-body" data-page="login">

<!-- PAGE LOADER (hidden automatically by common.js when the page is ready) -->
<div id="pageLoader" role="status" aria-live="polite" aria-label="Loading">
    <div class="loader-ring"><div class="loader-badge"><i class="fa-solid fa-indian-rupee-sign"></i></div></div>
    <div class="loader-text">Loading<span class="loader-dots"><span>.</span><span>.</span><span>.</span></span></div>
</div>


<div class="login-card">
    <div class="login-badge"><i class="fa-solid fa-indian-rupee-sign"></i></div>
    <h1 id="authTitle">Sign in</h1>
    <p class="sub" id="authSub">Use your email and password</p>

    <div class="auth-tabs" role="tablist">
        <button type="button" id="tabLogin" class="active" role="tab">Sign in</button>
        <button type="button" id="tabSignup" role="tab">Create account</button>
    </div>

    <div id="authMsg" class="alert py-2 small" role="alert"></div>

    <!-- SIGN IN -->
    <form id="loginForm" novalidate>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-control" autocomplete="username" placeholder="you@example.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <div class="pw-wrap">
                <input type="password" id="password" class="form-control" autocomplete="current-password" placeholder="Your password" required>
                <button type="button" class="pw-toggle" data-target="password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
            </div>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary w-100">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign in
        </button>
    </form>

    <!-- CREATE ACCOUNT -->
    <form id="signupForm" novalidate style="display:none">
        <div class="mb-3">
            <label class="form-label" for="suName">Full name <span class="required-star">*</span></label>
            <input type="text" id="suName" class="form-control" maxlength="60" autocomplete="name" placeholder="Example: Arun" required>
            <div class="form-text">This name is saved as the creator on all your expenses.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="suEmail">Email <span class="required-star">*</span></label>
            <input type="email" id="suEmail" class="form-control" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="suPassword">Password <span class="required-star">*</span></label>
            <div class="pw-wrap">
                <input type="password" id="suPassword" class="form-control" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
                <button type="button" class="pw-toggle" data-target="suPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="suConfirm">Confirm password <span class="required-star">*</span></label>
            <div class="pw-wrap">
                <input type="password" id="suConfirm" class="form-control" autocomplete="new-password" placeholder="Re-enter password" required>
                <button type="button" class="pw-toggle" data-target="suConfirm" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
            </div>
        </div>
        <button type="submit" id="signupBtn" class="btn btn-primary w-100">
            <i class="fa-solid fa-user-plus me-1"></i> Create account
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
